services:
  - type: web
    name: roomcade
    runtime: docker
    plan: starter
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_PATH
        value: /var/data/roomcade.db
      - key: STATIC_DIR
        value: /app/dist
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
    disk:
      name: roomcade-data
      mountPath: /var/data
      sizeGB: 1
