services:
  - type: web
    name: roomcade
    runtime: docker
    plan: starter
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_PATH
        value: /var/data/roomcade.db
      - key: STATIC_DIR
        value: /app/dist
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: roomcade
          envVarKey: RENDER_EXTERNAL_URL
      - key: METRICS_TOKEN
        generateValue: true
      # Optional: add LIVEKIT_URL, LIVEKIT_API_KEY, and LIVEKIT_API_SECRET
      # in the dashboard when enabling voice.
    disk:
      name: roomcade-data
      mountPath: /var/data
      sizeGB: 1
