<style>

@media(max-width:850px) {

let houseId=1,roomId=1,voice=false,muted=false,micBlocked=false,nextHouse=3,nextRoom=5,modalState=null,returnFocus=null;
const words=['MOON','BREAD','PAPER','MOSS','CROWN','APPLE','BRIDGE','BUTTON','RIVER','GLASS','MAPLE','BELL','PILLOW','HONEY','KEY','CLOUD','STAR','GARDEN','CLOCK','SOCK','LAMP','BOAT','FEATHER','PEACH','BOOK'];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(action,label,classes='',attrs='')=>`<button type="button" class="rc-button ${classes}" data-action="${action}" ${attrs}>${label}</button>`;
const house=()=>houses.find(h=>h.id===houseId),room=()=>house()?.rooms.find(r=>r.id===roomId),isHost=()=>house()?.host==='me';
const canEdit=()=>isHost()||room()?.coordinator==='me';
const say=t=>{status.textContent=t};
const membersIn=r=>house().members.filter(m=>m.online&&m.room===r.id);
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})}
const sceneEnabled=r=>!!r&&view==='room'&&design.backdrop==='Fireside';
function renderRoomInterior(h,r){
  if(view==='overview')return `<header class="rc-overview-toolbar"><h2>House overview</h2>${btn('back-to-room',icon('arrow-left')+' Back to room','rc-quiet')}</header>`+renderOverview(h)+renderSocial(r);
  const cozy=sceneEnabled(r);
  return `<div class="rc-room-interior ${cozy?'rc-fireside':''} ${cozy&&!r.game?'rc-hangout':''}">
    ${cozy?renderScenery():''}
    <div class="rc-game-stage"><section class="rc-game-frame" aria-label="${r.game?'Codenames game preview':'Room game'}">${renderTableToolbar(r)}${renderGame(r)}</section></div>
    ${renderSocial(r)}
  </div>`;
}
function renderScenery(){
  return `<div class="rc-scenery" aria-hidden="true">
    <div class="rc-scene-ceiling"><img src="${ceilingArt}" alt="" draggable="false"></div>
    <div class="rc-scene-painting">
      <img src="${roomArt}" alt="" draggable="false">
      <div class="rc-firelight"></div>
      <div class="rc-fire"><span class="rc-coals"></span><span class="rc-flame rc-flame-one"></span><span class="rc-flame rc-flame-two"></span><span class="rc-flame rc-flame-three"></span><span class="rc-ember rc-ember-one"></span><span class="rc-ember rc-ember-two"></span></div>
    </div>
    <div class="rc-scene-top"></div>
  </div>`;
}
function renderAmbienceControl(r){
  if(!sceneEnabled(r))return '';
  return btn('ambient-toggle',icon(ambientOn?'flame':'pause'),'rc-quiet rc-icon-button rc-ambience-control',`aria-label="${ambientOn?'Pause room animation':'Play room animation'}" data-tooltip="${ambientOn?'Pause firelight':'Play firelight'}" aria-pressed="${ambientOn}"`);
}

function applyDesign(){
  root.style.colorScheme=design.appearance==='Follow chat'?'':design.appearance==='Daylight'?'light':'dark';
  root.style.setProperty('--rc-radius',design.roundness+'px');
  root.classList.toggle('rc-compact',design.density==='Compact');
  root.classList.toggle('rc-ambient-paused',!ambientOn);
  const p=['light-dark(#594a3d,#e3d5be)','light-dark(#ebe5da,#454037)','light-dark(#f5f2ed,#292825)','light-dark(#ede9e1,#34302a)'];
  ['--rc-accent','--rc-soft','--rc-paper','--rc-wall'].forEach((k,i)=>root.style.setProperty(k,p[i]));
}
function brand(){return `<button type="button" class="rc-brand" data-action="home" aria-label="Roomcade home"><img class="rc-brand-art" src="${petArt}" alt=""><span class="rc-brand-wordmark">room<span class="rc-brand-em">cade</span></span></button>`}
function render(){
  applyDesign();
  if(houseId===null){renderHome();icons();return}
  const h=house(),r=room();
  app.innerHTML=`<div class="rc-lounge">${renderLoungeTop(h)}<main class="rc-main">${renderRoomInterior(h,r)}</main></div>`;
  icons();
}
function renderLoungeTop(h){
  return `<header class="rc-lounge-top">
    <div class="rc-lounge-house">
      ${brand()}
      <details class="rc-house-menu">
        <summary class="rc-lounge-picker" aria-label="${escape(h.name)} · House menu${isHost()&&h.requests.length?', '+h.requests.length+' pending requests':''}"><span class="rc-house-name">${escape(h.name)}</span>${icon('chevron-down')}${isHost()&&h.requests.length?`<span class="rc-count">${h.requests.length}</span>`:''}</summary>
        <div class="rc-menu-sheet">
          ${btn('overview',icon('panels-top-left')+' House overview')}
          ${btn('houses',icon('house')+' Switch House')}
          ${btn('home',icon('layout-grid')+' Your Houses')}
          ${isHost()?`<div class="rc-divider"></div>${btn('add-room',icon('plus')+' Add a room','',h.rooms.length>=4?'disabled':'')}${btn('requests',icon('bell')+' Review requests'+(h.requests.length?`<span class="rc-count">${h.requests.length}</span>`:''))}${btn('settings',icon('settings-2')+' House settings')}`:''}
        </div>
      </details>
    </div>
    <nav class="rc-room-tabs" aria-label="Rooms in ${escape(h.name)}" style="--rc-room-columns:${h.rooms.length}">
      ${h.rooms.map(a=>`<button type="button" class="rc-room-tab" data-room="${a.id}" ${view==='room'&&a.id===roomId?'aria-current="page"':''} data-tooltip="${escape(a.name)} · ${a.game?'Codenames':'Just hanging out'}"><span class="rc-tab-icon">${icon(a.icon)}</span><span class="rc-tab-text"><strong>${escape(a.name)}</strong><small>${membersIn(a).length} here${a.game?' · playing':''}</small></span></button>`).join('')}
    </nav>
    ${btn('invite',icon('user-plus')+' Invite','rc-top-invite')}
  </header>`;
}
function renderTableToolbar(r){
  return `<header class="rc-table-toolbar"><span class="rc-table-title">${icon(r.game?'gamepad-2':'sofa')}<span>${r.game?'Codenames':escape(r.name)}</span></span><div class="rc-table-actions">${renderAmbienceControl(r)}${renderGameMenu(r)}</div></header>`;
}
function renderGameMenu(r){
  if(!r.game&&!isHost())return '';
  return `${r.game?btn('reload',icon('rotate-cw'),'rc-quiet rc-icon-button','aria-label="Reload game for me" data-tooltip="Reload for me"'):''}
    <details class="rc-game-menu">
      <summary class="rc-button rc-quiet rc-icon-button" aria-label="Room and game options">${icon('ellipsis')}</summary>
      <div class="rc-menu-sheet">
        ${r.game?btn('external',icon('external-link')+' Open game externally'):''}
        ${r.game&&canEdit()?btn('replace',icon('repeat-2')+' Replace game')+btn('clear',icon('square-x')+' Clear game','rc-danger'):''}
        ${isHost()?`${r.game?'<div class="rc-divider"></div>':''}${btn('room-settings',icon('pencil')+' Rename room')}`:''}
      </div>
    </details>`;
}
function renderGame(r){
  if(!r.game&&sceneEnabled(r))return `<div class="rc-empty"><div class="rc-welcome-panel"><span class="rc-label">${escape(r.name)}</span><h2>Pull up a chair.</h2><p class="rc-muted rc-small">The fire’s on. Bring a game to the table, or just stay and talk.</p>${btn('setup',icon('plus')+' Bring Codenames in','rc-primary')}</div></div>`;
  if(!r.game)return `<div class="rc-empty">
    <img class="rc-empty-pet" src="${petArt}" alt="Roomcade’s little House character">
    <h2>Make yourself comfortable.</h2>
    <p class="rc-muted rc-small">Bring a game to the table, or stay a while and talk.</p>
    ${btn('setup',icon('plus')+' Bring Codenames in','rc-primary')}
  </div>`;
  return `<div class="rc-game-preview">
    <div class="rc-provider-head"><span class="rc-provider-name">CODENAMES</span><span class="rc-preview-label">Game preview</span></div>
    <div class="rc-board" role="img" aria-label="Illustrative Codenames board with twenty-five word cards. This is not a live game.">${words.map(w=>`<span class="rc-word">${w}</span>`).join('')}</div>
    <p class="rc-preview-caption">Illustrative board · no live match</p>
  </div>`;
}
function participantVoice(m){
  if(m.id==='me')return voice?(micBlocked?'Listening only':muted?'Muted':'In voice'):'Not in voice';
  return m.id==='sam'?'Speaking':m.id==='alex'?'Muted':'Not in voice';
}
function renderSocial(r){
  const people=membersIn(r),active=voice,voiceTitle=active?(micBlocked?'Listening only':muted?'Voice connected · muted':'Voice connected'):'Voice is optional';
  return `<section class="rc-social" aria-label="Participants and voice in ${escape(r.name)}">
    <div class="rc-people" aria-label="People in ${escape(r.name)}">
      ${people.map(m=>{
        const state=participantVoice(m),speaking=state==='Speaking',inVoice=state!=='Not in voice';
        const voiceIcon=speaking?'audio-lines':state==='Muted'?'mic-off':state==='Listening only'?'headphones':inVoice?'mic':'minus';
        const role=m.id===house().host?' · House host':m.id===r.coordinator?' · Game coordinator':'';
        return `<div class="rc-person ${speaking?'rc-person-speaking':''}" aria-label="${escape(m.name+role+' · '+state)}" data-tooltip="${escape(m.name+role+' · '+state)}">
          <span class="rc-person-face"><span class="rc-avatar" aria-hidden="true">${escape(m.name[0])}</span><span class="rc-person-status" aria-hidden="true">${icon(voiceIcon)}</span></span>
          <span class="rc-person-name ${m.id==='me'?'rc-self-name':''}">${escape(m.name)}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="rc-voice-cluster" aria-label="Your voice controls">
      <span class="rc-voice-status ${active?'connected':''}">${active?'<span class="rc-dot"></span>':''}${view==='overview'?escape(r.name)+' · ':''}${voiceTitle}</span>
      <div class="rc-voice-actions">
        ${active?(micBlocked?btn('mic-help',icon('headphones')+' Mic help'):btn('mute',icon(muted?'mic-off':'mic')+(muted?' Unmute':' Mute'),'','aria-pressed="'+muted+'"'))+btn('leave-voice',icon('phone-off')+' Leave','rc-danger','aria-label="Leave voice"'):btn('join-voice',icon('headphones')+' Join voice','rc-primary')}
      </div>
    </div>
  </section>`;
}
function renderOverview(h){
  return `<section class="rc-overview" aria-label="House floor plan">
    <div class="rc-overview-hero"><div><span class="rc-label">A place for your people</span><h1>${escape(h.name)}</h1><p>A few rooms. Good company. Find your spot.</p></div><img src="${petArt}" alt="Roomcade’s little House character"></div>
    <div class="rc-floorplan">${h.rooms.map(a=>`<button type="button" class="rc-plan-room" data-room="${a.id}">
      <span class="rc-row">${icon(a.icon)}<small>${membersIn(a).length} here</small></span>
      <strong>${escape(a.name)}</strong><span class="rc-row"><small>${a.game?'Codenames':'Just hanging out'}</small>${icon('arrow-up-right')}</span>
    </button>`).join('')}${h.rooms.length<4?`<button type="button" class="rc-plan-room rc-vacant" data-action="add-room" ${!isHost()?'disabled':''}>${icon('plus')}<span>${isHost()?'Make a room':'Room to grow'}</span></button>`:''}</div>
    <p class="rc-plan-foot">${h.members.length} of 8 members · ${h.rooms.length} of 4 rooms</p>
  </section>`;
}
function renderHome(){
  app.innerHTML=`<main class="rc-home">
    <div class="rc-home-top">${brand()}${btn('create-house',icon('plus')+' Create a House','rc-primary')}</div>
    <div class="rc-home-hero"><div><p class="rc-label">A place for your people</p><h1>Make yourself at home.</h1><p class="rc-muted">A few friends, a few rooms, something good to play.</p></div><img src="${petArt}" alt="Roomcade’s little House character"></div>
    <div class="rc-row rc-between" style="margin-bottom:16px"><h3>Your Houses</h3><span class="rc-small rc-muted">Saved in this browser</span></div>
    <div class="rc-house-grid">${houses.map(h=>`<button type="button" class="rc-house-card" data-house="${h.id}"><span class="rc-home-symbol">${icon('house')}</span><h2>${escape(h.name)}</h2><span class="rc-small rc-muted">${h.rooms.length} ${h.rooms.length===1?'room':'rooms'} · ${h.members.length} ${h.members.length===1?'member':'members'}</span><span class="rc-row rc-small">Come on in ${icon('arrow-right')}</span></button>`).join('')}</div>
  </main>`;
}

function open(type,extra={}){returnFocus=document.activeElement;root.querySelectorAll('details[open]').forEach(el=>el.open=false);modalState={type,houseId,roomId,...extra};drawModal();}
function drawModal(){const m=modalState;if(!m)return;let title='',body='',actions='',form=false;const h=house(),r=room();
if(m.type==='houses'){title='Your Houses';body=houses.map(a=>`<div class="rc-person-row"><span class="rc-row">${icon('house')} ${escape(a.name)}</span>${btn('enter-house','Enter','',`data-id="${a.id}"`)}</div>`).join('');actions=btn('create-house','Create a House','rc-primary')}
if(m.type==='create-house'){title='A House of your own.';body='<p>Start small. There’s room for eight friends and four rooms.</p><label>House name<input name="name" placeholder="The Sunday Club" required maxlength="36"></label>';actions='<button class="rc-button rc-primary" type="submit">Create House</button>';form=true}
if(m.type==='add-room'){title='Make a little room.';body='<p>A new corner of '+escape(h.name)+'.</p><label>Room name<input name="name" placeholder="The sunroom" required maxlength="28"></label><label>A little personality<select name="kind"><option value="sprout">Sunroom · soft sage</option><option value="coffee">Kitchen · warm clay</option><option value="moon">Loft · quiet lavender</option><option value="sofa">Lounge · soft sage</option></select></label>';actions='<button class="rc-button rc-primary" type="submit">Add room</button>';form=true}
if(m.type==='requests'){title='Someone’s at the door.';body=`<p>You choose who comes into ${escape(h.name)}. ${h.members.length}/8 seats are taken.</p>`+(h.requests.length?h.requests.map(q=>`<div class="rc-person-row"><span class="rc-row"><span class="rc-avatar">${escape(q.name[0])}</span>${escape(q.name)}</span><span class="rc-row">${btn('decline','Decline','rc-quiet',`data-id="${q.id}"`)}${btn('approve','Let in','rc-primary',`data-id="${q.id}" ${h.members.length>=8?'disabled':''}`)}</span></div>`).join(''):'<div class="rc-callout">Everyone’s been taken care of.</div>');actions=btn('close','Done')}
if(m.type==='invite'){title='Good company starts here.';body=`<p>Share your House invite. New friends will ask to join, and the host can let them in.</p><label>Sample invite link<input readonly value="roomcade.example/join/maple-preview"></label><div class="rc-callout rc-small">${h.members.length}/8 members · host approval required</div>`;actions=btn('invite-preview','Preview guest view')+btn('copy-invite','Copy invite','rc-primary')}
if(m.type==='guest'){title='You’re invited in.';body=`<p>${escape(h.name)} has a spot for you. Pick a name and ask to join.</p><label>Your name<input name="name" placeholder="Your display name" minlength="2" maxlength="24" required></label>`;actions='<button class="rc-button rc-primary" type="submit">Ask to join</button>';form=true}
if(m.type==='waiting'){title='Knock, knock.';body=`<p>Your request is with the House host. You’ll enter once they let you in.</p><div class="rc-callout rc-row">${icon('clock-3')} Waiting for approval</div>`;actions=btn('requests','Back to host view','rc-primary')}
if(m.type==='setup'||m.type==='replace'){const replacing=m.type==='replace';title=replacing?'Bring a new game to the table.':'Bring your Codenames lobby.';body=`<div class="rc-row"><span class="rc-step">1</span><span class="rc-small">Create a private lobby on Codenames.</span></div><div style="margin:10px 0 18px 33px">${btn('create-lobby',icon('external-link')+' Create Codenames lobby')}</div><div class="rc-row"><span class="rc-step">2</span><span class="rc-small">Paste its room link here for everyone.</span></div><label>Private room URL<input name="url" placeholder="https://codenames.game/r/…" type="url" required value="${escape(m.url||'')}"></label><div class="rc-row" style="margin-top:8px">${btn('sample-url','Use a sample link','rc-quiet')}<span class="rc-small rc-muted">For this preview</span></div><p class="rc-validation" id="rc-form-error" role="alert"></p><p class="rc-small">Whoever created the Codenames lobby starts the game there.</p>`;actions=`<button class="rc-button rc-primary" type="submit">${replacing?'Continue':'Bring game into room'}</button>`;form=true}
if(m.type==='confirm-replace'){title='Replace the game for everyone?';body=`<p>Everyone in ${escape(r.name)} will load the new lobby. The current game stays on Codenames, but this room will point to the new one.</p><div class="rc-callout rc-small">This changes the game for the whole room.</div>`;actions=btn('close','Keep current game')+btn('commit-replace','Replace for everyone','rc-primary')}
if(m.type==='confirm-clear'){title='Clear the table?';body='<p>This removes the shared game from this room. It does not delete the Codenames lobby.</p>';actions=btn('close','Keep game')+btn('commit-clear','Clear for everyone','rc-primary')}
if(m.type==='external'){title='Your game, another window.';body='<p>In the live app, this opens the room’s original Codenames lobby in a new tab. Your Roomcade voice stays here.</p><div class="rc-callout rc-small">This concept uses a sample game link.</div>';actions=btn('close','Got it','rc-primary')}
if(m.type==='voice'){title='Pull up a chair.';body='<p>Join voice in '+escape(r.name)+'. Once you join, voice follows you when you move rooms.</p><div class="rc-callout rc-small">Voice is simulated in this concept. Your microphone won’t be accessed.</div>';actions=btn('listen','Try mic-denied state')+btn('connect','Join voice','rc-primary')}
if(m.type==='mic-help'){title='You can still listen.';body='<p>Your browser hasn’t given Roomcade microphone access. In the live app, enable microphone permission in your browser’s site settings, then try again.</p>';actions=btn('enable-mic','Simulate permission granted','rc-primary')}
if(m.type==='room-settings'){title='Rename this room.';body=`<label>Room name<input name="name" value="${escape(r.name)}" required maxlength="28"></label>`;actions='<button class="rc-button rc-primary" type="submit">Save name</button>';form=true}
if(m.type==='settings'){title='House keeping';body=`<label>House name<input name="name" value="${escape(h.name)}" required maxlength="36"></label><label>House host<select name="host">${h.members.map(p=>`<option value="${p.id}" ${p.id===h.host?'selected':''}>${escape(p.name)}</option>`).join('')}</select></label><p class="rc-small" style="margin-top:12px">Transferring host gives this person House controls.</p><div class="rc-divider"></div><div class="rc-row rc-between"><span class="rc-small">Members · ${h.members.length}/8</span>${btn('members','Manage members')}</div><p class="rc-small" style="margin-top:17px">A House closes after 30 days without member activity.</p>`;actions='<button class="rc-button rc-primary" type="submit">Save changes</button>';form=true}
if(m.type==='members'){title='The people make the House.';body=h.members.map(p=>`<div class="rc-person-row"><span class="rc-row"><span class="rc-avatar">${escape(p.name[0])}</span><span>${escape(p.name)}<small class="rc-muted" style="display:block">${p.id===h.host?'House host':p.online?'Here now':'Offline'}</small></span></span>${p.id==='me'?'':btn('remove-member','Remove','rc-quiet',`data-id="${p.id}"`)}</div>`).join('');actions=btn('close','Done')}
if(m.type==='confirm-remove'){title='Remove '+escape(m.name)+'?';body='<p>They’ll lose access to this House. To come back, they’ll need to request approval again.</p>';actions=btn('close','Keep member')+btn('commit-remove','Remove member','rc-primary')}
modal.hidden=false;modal.className='rc-overlay';modal.innerHTML=`<${form?'form':'section'} class="rc-dialog" role="dialog" aria-modal="true" aria-labelledby="rc-dialog-title"><div class="rc-dialog-head"><h2 id="rc-dialog-title">${title}</h2>${btn('close',icon('x'),'rc-quiet','aria-label="Close dialog"')}</div>${body}<div class="rc-dialog-actions">${actions}</div></${form?'form':'section'}>`;icons();const focus=modal.querySelector('input:not([readonly]),select,button');if(focus)focus.focus();}
function close(){modalState=null;modal.hidden=true;modal.innerHTML='';if(returnFocus?.isConnected)returnFocus.focus()}
function swapHouse(id){view='room';houseId=id;roomId=house().rooms[0].id;house().members.find(m=>m.id==='me').room=roomId;voice=false;close();render();say('Welcome to '+house().name+'.')}
function gameURL(value){try{const u=new URL(value);if(u.protocol!=='https:'||u.hostname!=='codenames.game'||u.port||u.username||u.password||u.hash||u.search||!/^\/r\/[a-zA-Z0-9_-]+\/?$/.test(u.pathname))return null;return u.origin+u.pathname.replace(/\/$/,'')}catch{return null}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.house){swapHouse(Number(b.dataset.house));return}if(b.dataset.room){const target=Number(b.dataset.room);if(target===roomId){view='room';root.classList.remove('rc-nav-open');render();return}view='room';const old=room();house().members.find(m=>m.id==='me').room=target;if(old.coordinator==='me'){const successor=membersIn(old)[0];if(successor)old.coordinator=successor.id}roomId=target;root.classList.remove('rc-nav-open');render();say('You’re in '+room().name+(voice?'. Voice moved with you.':'.'));return}
const a=b.dataset.action;if(a==='ambient-toggle'){ambientOn=!ambientOn;root.classList.toggle('rc-ambient-paused',!ambientOn);b.setAttribute('aria-label',ambientOn?'Pause room animation':'Play room animation');b.setAttribute('data-tooltip',ambientOn?'Pause firelight':'Play firelight');b.setAttribute('aria-pressed',String(ambientOn));b.innerHTML=icon(ambientOn?'flame':'pause');icons();say(ambientOn?'Firelight is moving softly.':'Room animation paused.');return}root.querySelectorAll('details[open]').forEach(el=>el.open=false);if(a==='overview'||a==='back-to-room'){view=a==='overview'?'overview':'room';root.classList.remove('rc-nav-open');render();return}if(a==='home'){houseId=null;voice=false;close();render();say('Every House has its people.');return}if(a==='enter-house'){swapHouse(Number(b.dataset.id));return}if(a==='mobile-nav'){const expanded=root.classList.toggle('rc-nav-open');b.setAttribute('aria-expanded',String(expanded));return}if(a==='close'){close();return}
if(a==='create-house'||a==='houses'){open(a);return}if(['add-room','requests','settings','room-settings','members'].includes(a)){if(isHost())open(a);return}if(a==='invite'){open('invite');return}if(a==='invite-preview'){open('guest');return}if(a==='copy-invite'){say('Preview: invite copied. This sample link does not open a real House.');close();return}
if(a==='approve'||a==='decline'){if(!isHost())return;const h=house(),q=h.requests.find(q=>q.id===b.dataset.id);if(!q)return;if(a==='approve'){if(h.members.length>=8)return;h.members.push({id:q.id,name:q.name,room:h.rooms[0].id,online:true})}h.requests=h.requests.filter(x=>x.id!==q.id);render();drawModal();say(a==='approve'?q.name+' is in. Make room at the table.':q.name+'’s request was declined.');return}
if(a==='setup'){if(!room().game)open('setup');return}if(a==='replace'){if(canEdit())open('replace');return}if(a==='sample-url'){modal.querySelector('input[name=url]').value='https://codenames.game/r/demo-'+(room().revision+1);return}if(a==='create-lobby'){say('Preview: this opens Codenames so you can create a lobby. Use a sample link to continue here.');return}if(a==='commit-replace'){if(!canEdit())return;room().game=modalState.url;room().revision++;room().coordinator='me';close();render();say('New game set for everyone in '+room().name+'.');return}if(a==='reload'){say('Preview: reloaded the game for you. Everyone else stays where they are.');return}if(a==='external'){open('external');return}if(a==='clear'){if(canEdit())open('confirm-clear');return}if(a==='commit-clear'){if(!canEdit())return;room().game=null;room().coordinator=null;room().revision++;close();render();say('Table cleared. Voice stays in the room.');return}
if(a==='join-voice'){open('voice');return}if(a==='connect'||a==='listen'){voice=true;micBlocked=a==='listen';muted=false;close();render();say(micBlocked?'Preview: listening with microphone blocked.':'Preview: voice joined in '+room().name+'.');return}if(a==='mute'){muted=!muted;render();say(muted?'Preview: microphone muted.':'Preview: microphone unmuted.');return}if(a==='leave-voice'){voice=false;micBlocked=false;render();say('You left voice. You’re still in the room.');return}if(a==='mic-help'){open('mic-help');return}if(a==='enable-mic'){micBlocked=false;close();render();say('Preview: microphone permission granted.');return}
if(a==='remove-member'){if(!isHost())return;const p=house().members.find(p=>p.id===b.dataset.id);if(p)open('confirm-remove',{id:p.id,name:p.name});return}if(a==='commit-remove'){if(!isHost())return;const id=modalState.id;house().members=house().members.filter(p=>p.id!==id);house().rooms.forEach(r=>{if(r.coordinator===id)r.coordinator=membersIn(r)[0]?.id||'me'});close();render();say('Member removed from the House.');return}
});
root.addEventListener('submit',e=>{e.preventDefault();if(!modalState)return;const m=modalState,f=e.target;const value=n=>f.querySelector('[name="'+n+'"]').value.trim();if(m.type==='create-house'){const name=value('name');if(!name)return;const h={id:nextHouse++,name,host:'me',members:[],requests:[],rooms:[{id:nextRoom++,name:'Living Room',icon:'sofa',tone:'sage',game:null,coordinator:null,revision:0}]};h.members.push({id:'me',name:'You',room:h.rooms[0].id,online:true});houses.push(h);swapHouse(h.id);say('Your House is ready. Invite someone over.');return}
if(m.type==='add-room'){if(!isHost()||house().rooms.length>=4)return;const name=value('name'),kind=value('kind');if(!name)return;house().rooms.push({id:nextRoom++,name,icon:kind,tone:kind==='coffee'?'clay':kind==='moon'?'lilac':'sage',game:null,coordinator:null,revision:0});close();render();say(name+' is ready.');return}
if(m.type==='setup'||m.type==='replace'){const url=gameURL(value('url'));if(!url){f.querySelector('#rc-form-error').textContent='Use a private codenames.game/r/… link without extra parameters.';return}if(m.type==='replace'){if(canEdit())open('confirm-replace',{url});return}if(room().game){say('A game has already been added.');close();return}room().game=url;room().coordinator='me';room().revision++;close();render();say('Codenames is at the table. Everyone uses this room’s link.');return}
if(m.type==='guest'){const name=value('name');if(name.length<2)return;if(house().members.some(p=>p.name.toLowerCase()===name.toLowerCase())){say('That display name is already taken.');return}house().requests.push({id:'guest-'+Date.now(),name});render();open('waiting');return}
if(m.type==='room-settings'){if(!isHost())return;room().name=value('name')||room().name;close();render();say('Room name saved.');return}if(m.type==='settings'){if(!isHost())return;const old=house().host;house().name=value('name')||house().name;house().host=value('host');close();render();say(old!==house().host?'House host transferred. You’re now a regular member.':'House settings saved.');return}
});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){root.querySelectorAll('details[open]').forEach(el=>{el.open=false;el.querySelector('summary').focus()})}if(modal.hidden)return;if(e.key==='Escape'){close();return}if(e.key==='Tab'){const nodes=[...modal.querySelectorAll('button:not([disabled]),input,select')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
if(globalThis.Tweak){
 const tweak=new Tweak({container:root,onChange:()=>{render();if(modalState)drawModal()}});
 tweak.addSelect(design,'backdrop',{label:'All rooms backdrop',options:['Fireside','Plain']});
 tweak.addSelect(design,'appearance',{label:'Lighting',options:['Follow chat','Daylight','Evening lamplight']});
 tweak.addSelect(design,'density',{label:'People strip',options:['Roomy','Compact']});
 tweak.addSlider(design,'roundness',{label:'Game corners',min:4,max:20,unit:'px'});
}
})();

</script>
